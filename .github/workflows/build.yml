name: Build QQ Foreground Push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install dpkg ldid

      - name: Install Theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown $(whoami) /opt/theos
          git clone --depth=1 --recursive https://github.com/theos/theos.git /opt/theos

      - name: Install SDK
        run: |
          cd /opt/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git sdks-tmp
          cp -r sdks-tmp/iPhoneOS16.5.sdk .
          rm -rf sdks-tmp

      - name: Build
        run: |
          export THEOS=/opt/theos
          export THEOS_PACKAGE_SCHEME=rootless
          make clean || true
          make FINALPACKAGE=1

      - name: Verify
        run: |
          DYLIB=".theos/obj/QQForePush.dylib"
          echo "=== Architecture ==="
          lipo -info "$DYLIB" || file "$DYLIB"
          echo "=== PAC stubs (arm64e) ==="
          otool -tv -arch arm64e "$DYLIB" | grep -c paciza || echo "0"
          echo "=== objc_msgSend ==="
          otool -tv "$DYLIB" | grep -c objc_msgSend || echo "0"
          echo "=== Sections ==="
          otool -l -arch arm64e "$DYLIB" | grep -E 'mod_init|init_offset' | sort -u

      - name: Convert plist to binary
        run: |
          plutil -convert binary1 QQForePush.plist -o QQForePush_bplist.plist

      - name: Stage and build deb
        run: |
          DYLIB=".theos/obj/QQForePush.dylib"
          STAGE="/tmp/qqfp-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/DEBIAN"
          mkdir -p "$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries"

          cp control "$STAGE/DEBIAN/control"
          echo "" >> "$STAGE/DEBIAN/control"
          cp postinst "$STAGE/DEBIAN/postinst"
          chmod 755 "$STAGE/DEBIAN/postinst"

          cp "$DYLIB" "$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries/QQForePush.dylib"
          cp QQForePush_bplist.plist "$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries/QQForePush.plist"
          chmod 755 "$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries/QQForePush.dylib"

          dpkg-deb --build --root-owner-group "$STAGE" \
            "com.minis.qqforepush_3.1.0_iphoneos-arm64.deb"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: qqforepush-deb
          path: com.minis.qqforepush_3.1.0_iphoneos-arm64.deb
