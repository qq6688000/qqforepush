name: Build QQ Foreground Push

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install dpkg ldid

      - name: Install Theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown $(whoami) /opt/theos
          git clone --depth=1 --recursive https://github.com/theos/theos.git /opt/theos

      - name: Install SDK
        run: |
          cd /opt/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git sdks-tmp
          cp -r sdks-tmp/iPhoneOS16.5.sdk .
          rm -rf sdks-tmp

      - name: Build
        run: |
          export THEOS=/opt/theos
          export THEOS_PACKAGE_SCHEME=rootless
          make clean || true
          make FINALPACKAGE=1

      - name: Re-sign with correct ident
        run: |
          DYLIB=".theos/obj/QQForePush.dylib"
          ldid -S "$DYLIB"
          echo "=== PAC stubs ==="
          otool -tv -arch arm64e "$DYLIB" | grep -c paciza || echo "0"
          echo "=== ident ==="
          codesign -dvvv "$DYLIB" 2>&1 || true

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: QQForePush-dylib
          path: .theos/obj/QQForePush.dylib
